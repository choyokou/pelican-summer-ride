<script>
(() => {
  const scene = document.getElementById('summer');
  const svg = scene.querySelector('svg');
  const pauseButton = document.getElementById('pause');
  const speedButton = document.getElementById('speed');
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const portrait = window.matchMedia('(max-width:700px)');
  function fitScene(){svg.setAttribute('viewBox',portrait.matches?'390 100 820 820':'0 0 1600 1000');}
  portrait.addEventListener('change',fitScene);
  fitScene();
  const elements = Object.fromEntries(['near-leg','near-leg-light','far-leg','near-foot','far-foot','near-pedal','crank'].map(id=>[id,document.getElementById(id)]));
  const spokes = [...scene.querySelectorAll('.spokes')];
  let paused = reducedMotion.matches;
  let fast = false;
  let time = 0;
  let previous = null;
  const cx=803, cy=727, radius=31;
  function legPath(hip, foot, bend) {
    const dx=foot.x-hip.x, dy=foot.y-hip.y;
    const distance=Math.hypot(dx,dy);
    const upper=91, lower=96;
    const along=(upper*upper-lower*lower+distance*distance)/(2*distance);
    const height=Math.sqrt(Math.max(0,upper*upper-along*along));
    const knee={x:hip.x+along*dx/distance+bend*height*dy/distance,y:hip.y+along*dy/distance-bend*height*dx/distance};
    return `M${hip.x} ${hip.y} Q${knee.x} ${knee.y} ${knee.x} ${knee.y} L${foot.x} ${foot.y}`;
  }
  function draw() {
    const angle=time*2*Math.PI/1.65;
    const foot={x:cx+Math.cos(angle)*radius,y:cy+Math.sin(angle)*radius};
    const far={x:cx-Math.cos(angle)*radius,y:cy-Math.sin(angle)*radius};
    const bounce=2*Math.sin(time*2*Math.PI/1.15);
    const path=legPath({x:791,y:568+bounce},foot,1);
    elements['near-leg'].setAttribute('d',path);
    elements['near-leg-light'].setAttribute('d',path);
    elements['far-leg'].setAttribute('d',legPath({x:765,y:574+bounce},far,-1));
    elements['near-foot'].setAttribute('transform',`translate(${foot.x} ${foot.y-5}) rotate(-7)`);
    elements['far-foot'].setAttribute('transform',`translate(${far.x} ${far.y-5})`);
    elements['near-pedal'].setAttribute('transform',`translate(${foot.x} ${foot.y})`);
    elements.crank.setAttribute('transform',`rotate(${angle*180/Math.PI})`);
    spokes.forEach(wheel=>wheel.setAttribute('transform',`rotate(${time*240})`));
  }
  function updatePause() {
    scene.classList.toggle('paused',paused);
    pauseButton.setAttribute('aria-pressed',String(paused));
    document.getElementById('pause-text').textContent=paused?'继续出发':'歇一会儿';
    pauseButton.querySelector('.pause-symbol').textContent=paused?'▷':'Ⅱ';
    if(paused) svg.pauseAnimations(); else svg.unpauseAnimations();
    scene.getAnimations().forEach(animation=>{if(paused)animation.pause();else animation.play();});
  }
  pauseButton.addEventListener('click',()=>{paused=!paused;updatePause();});
  speedButton.addEventListener('click',()=>{
    fast=!fast;
    speedButton.textContent=fast?'迎风 · 轻快':'微风 · 悠闲';
    speedButton.setAttribute('aria-label',`切换骑行速度，当前为${fast?'轻快':'悠闲'}`);
    scene.getAnimations().forEach(animation=>animation.updatePlaybackRate(fast?1.7:1));
  });
  document.addEventListener('visibilitychange',()=>{previous=null;});
  function tick(now) {
    if(previous!==null&&!paused) time+=Math.min((now-previous)/1000,.06)*(fast?1.7:1);
    previous=now;
    if(!paused) draw();
    requestAnimationFrame(tick);
  }
  draw();updatePause();requestAnimationFrame(tick);
})();
</script>
